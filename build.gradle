plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	version = rootProject.version
	group = rootProject.group

	base {
		archivesName = project.name
	}

	repositories {
		maven { url 'https://maven.nucleoid.xyz/' }
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	}

	processResources {
		def modVersion = project.version
		inputs.property "version", modVersion

		filesMatching("fabric.mod.json") {
			expand "version": modVersion
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	def copyModJar = tasks.register('copyModJar', Copy) {
		from layout.buildDirectory.dir('libs')
		include '*.jar'
		exclude '*-sources.jar'
		into rootProject.layout.buildDirectory.dir('mods')
	}

	tasks.named('build') {
		finalizedBy(copyModJar)
	}
}